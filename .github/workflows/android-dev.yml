name: Android Dev — Build & Firebase Distribution

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.nsnr.aplhavlogs.dev
  FIREBASE_PROJECT_ID: alpha-vlogs-cf60a
  FIREBASE_TESTER_GROUP: testers

jobs:
  build-and-distribute:
    name: Android Develop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: yarn lint --max-warnings=0

      - name: Run TypeScript validation
        run: yarn type-check

      - name: Run Jest tests
        run: yarn test:ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Resolve Firebase Android App ID
        id: firebase_app
        run: |
          APP_ID=$(node -e "
            const cfg = require('./android/app/google-services.json');
            const pkg = '${{ env.PACKAGE_NAME }}';
            const client = cfg.client.find(
              (c) => c.client_info.android_client_info.package_name === pkg
            );
            if (!client) {
              console.error('No Firebase client for package:', pkg);
              process.exit(1);
            }
            process.stdout.write(client.client_info.mobilesdk_app_id);
          ")
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Firebase App ID: $APP_ID"

      - name: Build develop APK
        run: |
          cd android
          VERSION_CODE=${{ github.run_number }}
          echo "Building APK — package: ${{ env.PACKAGE_NAME }}, versionCode: $VERSION_CODE"
          ./gradlew assembleDevelopRelease \
            -PversionCode="$VERSION_CODE" \
            --no-daemon

          APK_PATH="app/build/outputs/apk/develop/release/app-develop-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK built: $(du -h "$APK_PATH" | cut -f1)"

      - name: Build develop AAB
        run: |
          cd android
          VERSION_CODE=${{ github.run_number }}
          echo "Building AAB — package: ${{ env.PACKAGE_NAME }}, versionCode: $VERSION_CODE"
          ./gradlew bundleDevelopRelease \
            -PversionCode="$VERSION_CODE" \
            --no-daemon

          AAB_PATH="app/build/outputs/bundle/develop/release/app-develop-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "AAB built: $(du -h "$AAB_PATH" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-apk
          path: android/app/build/outputs/apk/develop/release/app-develop-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-aab
          path: android/app/build/outputs/bundle/develop/release/app-develop-release.aab
          retention-days: 30

      - name: Validate Firebase credentials
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "Missing required secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "$FIREBASE_SA_JSON" > "${{ runner.temp }}/firebase-service-account.json"
          if [ ! -s "${{ runner.temp }}/firebase-service-account.json" ]; then
            echo "Failed to write Firebase service account file"
            exit 1
          fi
          echo "Firebase service account configured"

      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npm install -g firebase-tools

          APK_PATH="android/app/build/outputs/apk/develop/release/app-develop-release.apk"
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${{ github.sha }}"
          RELEASE_NOTES="Android Dev build #${BUILD_NUMBER}"$'\n'"Package: ${{ env.PACKAGE_NAME }}"$'\n'"Commit: ${BUILD_SHA:0:7}"$'\n'"Workflow: ${{ github.workflow }}"

          firebase appdistribution:distribute "$APK_PATH" \
            --app "${{ steps.firebase_app.outputs.app_id }}" \
            --groups "${{ env.FIREBASE_TESTER_GROUP }}" \
            --release-notes "$RELEASE_NOTES" \
            --project "${{ env.FIREBASE_PROJECT_ID }}"

      - name: Build summary
        run: |
          {
            echo "## Android Dev — Build Summary"
            echo "- **Package:** \`${{ env.PACKAGE_NAME }}\`"
            echo "- **Version code:** \`${{ github.run_number }}\`"
            echo "- **Firebase App ID:** \`${{ steps.firebase_app.outputs.app_id }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Artifacts:** \`android-dev-apk\`, \`android-dev-aab\`"
            echo "- **Firebase:** [App Distribution](https://console.firebase.google.com/project/${{ env.FIREBASE_PROJECT_ID }}/appdistribution)"
          } >> "$GITHUB_STEP_SUMMARY"
