name: Android and iOS Firebase Distribution

on:
  workflow_dispatch:

concurrency:
  group: android-ios-firebase-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PACKAGE_NAME: com.nsnr.alphavlogs.dev
  IOS_BUNDLE_ID: com.nsnr.alphavlogs.dev
  FIREBASE_PROJECT_ID: alpha-vlogs-cf60a
  FIREBASE_TESTER_GROUP: testers
  FIREBASE_IOS_PLIST_PATH: ios/JackMarvelsApp/GoogleService-Info-Develop.plist
  # Xcode 26 runners default to the Metal cryptex toolchain, whose Swift lib
  # search path lacks the back-compat archives (libswiftCompatibility56.a, etc.)
  # that prebuilt Firebase binaries force-load, breaking the link. Pin the
  # default Xcode toolchain so those libraries are found.
  # https://github.com/actions/runner-images/issues/13135
  TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault

jobs:
  validate:
    name: Validate (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: yarn lint --max-warnings=0

      - name: Run TypeScript validation
        run: yarn type-check

      - name: Run Jest tests
        run: yarn test:ci

  android:
    name: Android Develop
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-development

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Resolve Firebase Android App ID
        id: firebase_app
        run: |
          APP_ID=$(node -e "
            const cfg = require('./android/app/google-services.json');
            const pkg = '${{ env.ANDROID_PACKAGE_NAME }}';
            const client = cfg.client.find(
              (c) => c.client_info.android_client_info.package_name === pkg
            );
            if (!client) {
              console.error('No Firebase client for package:', pkg);
              process.exit(1);
            }
            process.stdout.write(client.client_info.mobilesdk_app_id);
          ")
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Firebase App ID: $APP_ID"

      - name: Build develop APK
        run: |
          cd android
          VERSION_CODE=${{ github.run_number }}
          echo "Building APK — package: ${{ env.ANDROID_PACKAGE_NAME }}, versionCode: $VERSION_CODE"
          ./gradlew assembleDevelopRelease \
            -PversionCode="$VERSION_CODE" \
            --no-daemon

          APK_PATH="app/build/outputs/apk/develop/release/app-develop-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK built: $(du -h "$APK_PATH" | cut -f1)"

      - name: Build develop AAB
        run: |
          cd android
          VERSION_CODE=${{ github.run_number }}
          echo "Building AAB — package: ${{ env.ANDROID_PACKAGE_NAME }}, versionCode: $VERSION_CODE"
          ./gradlew bundleDevelopRelease \
            -PversionCode="$VERSION_CODE" \
            --no-daemon

          AAB_PATH="app/build/outputs/bundle/developRelease/app-develop-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "AAB built: $(du -h "$AAB_PATH" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-apk
          path: android/app/build/outputs/apk/develop/release/app-develop-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-aab
          path: android/app/build/outputs/bundle/developRelease/app-develop-release.aab
          retention-days: 30

      - name: Validate Firebase credentials
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "Missing required secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "$FIREBASE_SA_JSON" > "${{ runner.temp }}/firebase-service-account.json"
          if [ ! -s "${{ runner.temp }}/firebase-service-account.json" ]; then
            echo "Failed to write Firebase service account file"
            exit 1
          fi
          echo "Firebase service account configured"

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_TESTER_EMAILS: ${{ secrets.FIREBASE_TESTER_EMAILS }}
        run: |
          echo "Node version for Firebase CLI: $(node -v)"
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major<20){console.error('firebase-tools 15.x requires Node 20+'); process.exit(1)}"

          FIREBASE_VERSION=15.22.0
          FB="npx --yes firebase-tools@${FIREBASE_VERSION}"

          APK_PATH="android/app/build/outputs/apk/develop/release/app-develop-release.apk"
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${{ github.sha }}"
          RELEASE_NOTES="Android Dev build #${BUILD_NUMBER}"$'\n'"Package: ${{ env.ANDROID_PACKAGE_NAME }}"$'\n'"Commit: ${BUILD_SHA:0:7}"$'\n'"Workflow: ${{ github.workflow }}"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi

          $FB appdistribution:group:create "Testers" "${{ env.FIREBASE_TESTER_GROUP }}" \
            --project "${{ env.FIREBASE_PROJECT_ID }}" 2>/dev/null || true

          DISTRIBUTE_ARGS=(
            --app "${{ steps.firebase_app.outputs.app_id }}"
            --release-notes "$RELEASE_NOTES"
            --project "${{ env.FIREBASE_PROJECT_ID }}"
          )

          if [ -n "${FIREBASE_TESTER_EMAILS:-}" ]; then
            DISTRIBUTE_ARGS+=(--testers "$FIREBASE_TESTER_EMAILS")
          fi

          if [ -n "${{ env.FIREBASE_TESTER_GROUP }}" ]; then
            DISTRIBUTE_ARGS+=(--groups "${{ env.FIREBASE_TESTER_GROUP }}")
          fi

          if [ ${#DISTRIBUTE_ARGS[@]} -le 3 ]; then
            echo "No testers configured. Set FIREBASE_TESTER_EMAILS secret and/or FIREBASE_TESTER_GROUP."
            exit 1
          fi

          $FB appdistribution:distribute "$APK_PATH" "${DISTRIBUTE_ARGS[@]}"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Android Dev — Build Summary"
            echo "- **Package:** \`${{ env.ANDROID_PACKAGE_NAME }}\`"
            echo "- **Version code:** \`${{ github.run_number }}\`"
            echo "- **Firebase App ID:** \`${{ steps.firebase_app.outputs.app_id }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Artifacts:** \`android-dev-apk\`, \`android-dev-aab\`"
            echo "- **Firebase:** [App Distribution](https://console.firebase.google.com/project/${{ env.FIREBASE_PROJECT_ID }}/appdistribution)"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS Develop
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    environment: ios-development

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Resolve Firebase iOS App ID
        id: firebase_app
        run: |
          DEV_PLIST="${{ env.FIREBASE_IOS_PLIST_PATH }}"
          PROD_PLIST="ios/JackMarvelsApp/GoogleService-Info.plist"

          if [ ! -f "$DEV_PLIST" ]; then
            echo "Missing Firebase plist: $DEV_PLIST"
            exit 1
          fi
          if [ ! -f "$PROD_PLIST" ]; then
            echo "Missing Firebase plist: $PROD_PLIST"
            exit 1
          fi

          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$DEV_PLIST")
          BUNDLE_IN_PLIST=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$DEV_PLIST")
          PROD_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$PROD_PLIST")

          if [ "$BUNDLE_IN_PLIST" != "${{ env.IOS_BUNDLE_ID }}" ]; then
            echo "Firebase plist BUNDLE_ID mismatch: expected ${{ env.IOS_BUNDLE_ID }}, got $BUNDLE_IN_PLIST"
            exit 1
          fi

          if [ "$APP_ID" = "$PROD_APP_ID" ]; then
            echo "Develop and production iOS Firebase apps share the same GOOGLE_APP_ID ($APP_ID)."
            echo "Register a separate iOS app for ${{ env.IOS_BUNDLE_ID }} in Firebase Console,"
            echo "then replace $DEV_PLIST with the downloaded GoogleService-Info.plist."
            echo "See docs/FIREBASE_CONSOLE_UPDATE.md"
            exit 1
          fi

          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Firebase App ID: $APP_ID (bundle: $BUNDLE_IN_PLIST)"

      - name: Setup development code signing (optional)
        id: dev_signing
        env:
          IOS_DEV_CERTIFICATE_BASE64: ${{ secrets.IOS_DEV_CERTIFICATE_BASE64 }}
          IOS_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEV_CERTIFICATE_PASSWORD }}
          IOS_DEV_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'github-actions' }}
        run: |
          if [ -z "$IOS_DEV_CERTIFICATE_BASE64" ] || [ -z "$IOS_DEV_PROVISIONING_PROFILE_BASE64" ]; then
            echo "No iOS development signing secrets configured — building unsigned archive"
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          echo "$IOS_DEV_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate is empty. IOS_DEV_CERTIFICATE_BASE64 is missing or not valid base64."
            echo "Re-create it with:  base64 -i Certificates.p12 | pbcopy   (macOS) and paste into the secret."
            exit 1
          fi

          # Preflight: confirm the .p12 can be opened with the provided password before importing.
          # This surfaces a wrong IOS_DEV_CERTIFICATE_PASSWORD with a clear message instead of a cryptic keychain error.
          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$IOS_DEV_CERTIFICATE_PASSWORD" -nokeys -legacy >/dev/null 2>&1 \
             && ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$IOS_DEV_CERTIFICATE_PASSWORD" -nokeys >/dev/null 2>&1; then
            echo "::error::Cannot open the certificate with IOS_DEV_CERTIFICATE_PASSWORD."
            echo "Either the password is wrong, or the base64 does not contain a valid .p12."
            echo "Verify locally with:  openssl pkcs12 -in Certificates.p12 -nokeys -info"
            exit 1
          fi

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DEV_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # set-key-partition-list often returns exit 1 on GHA even when import succeeded
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          echo "$IOS_DEV_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          if [ -z "$PROFILE_UUID" ]; then
            echo "Failed to extract provisioning profile UUID"
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH" "$PROFILE_PLIST"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
          echo "Development signing configured (profile: $PROFILE_NAME / $PROFILE_UUID)"

      - name: Configure app target signing
        if: steps.dev_signing.outputs.signing_enabled == 'true'
        env:
          IOS_DEV_TEAM_ID: ${{ secrets.IOS_DEV_TEAM_ID }}
          PROFILE_UUID: ${{ steps.dev_signing.outputs.profile_uuid }}
          PROFILE_NAME: ${{ steps.dev_signing.outputs.profile_name }}
          IOS_BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
        run: |
          cd ios
          python3 <<'PY'
          import os
          import re

          path = "JackMarvelsApp.xcodeproj/project.pbxproj"
          team = os.environ["IOS_DEV_TEAM_ID"]
          profile_uuid = os.environ["PROFILE_UUID"]
          profile_name = os.environ["PROFILE_NAME"]
          bundle_id = os.environ["IOS_BUNDLE_ID"]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          block_id = "13B07F951A680F5B00A75B9A"
          pattern = rf"({re.escape(block_id)} /\* Release \*/ = \{{\n\t\t\tisa = XCBuildConfiguration;\n\t\t\tbaseConfigurationReference = [^;]+;\n\t\t\tbuildSettings = \{{)(.*?)(\n\t\t\t\}};\n\t\t\tname = Release;)"

          def patch_release_block(match: re.Match) -> str:
              settings = match.group(2)
              for key in (
                  "CODE_SIGN_STYLE",
                  "CODE_SIGN_IDENTITY",
                  "PROVISIONING_PROFILE",
                  "PROVISIONING_PROFILE_SPECIFIER",
              ):
                  settings = re.sub(rf"\n\t\t\t\t{key} = [^;]*;", "", settings)

              settings += (
                  f'\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                  f'\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Development";'
                  f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};'
                  f'\n\t\t\t\tPROVISIONING_PROFILE = "{profile_uuid}";'
                  f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
                  f'\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = {bundle_id};'
              )
              return match.group(1) + settings + match.group(3)

          updated, count = re.subn(pattern, patch_release_block, content, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("Failed to patch JackMarvelsApp Release signing settings in project.pbxproj")

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Configured manual signing for JackMarvelsApp Release ({bundle_id})")
          PY

      - name: Build iOS archive
        env:
          SIGNING_ENABLED: ${{ steps.dev_signing.outputs.signing_enabled }}
          IOS_DEV_TEAM_ID: ${{ secrets.IOS_DEV_TEAM_ID }}
        run: |
          cd ios
          if [ "$SIGNING_ENABLED" = "true" ]; then
            if [ -z "$IOS_DEV_TEAM_ID" ]; then
              echo "Missing IOS_DEV_TEAM_ID secret"
              exit 1
            fi
            # Profile is set on JackMarvelsApp target only (see Configure app target signing).
            xcodebuild clean archive \
              -workspace JackMarvelsApp.xcworkspace \
              -scheme JackMarvelsApp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/AlphaVlogs-dev.xcarchive" \
              DEVELOPMENT_TEAM="$IOS_DEV_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Development" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES
          else
            xcodebuild clean archive \
              -workspace JackMarvelsApp.xcworkspace \
              -scheme JackMarvelsApp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/AlphaVlogs-dev.xcarchive" \
              PRODUCT_BUNDLE_IDENTIFIER="${{ env.IOS_BUNDLE_ID }}" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

          if [ ! -d "$PWD/build/AlphaVlogs-dev.xcarchive" ]; then
            echo "Archive not created"
            exit 1
          fi

      - name: Export development IPA
        id: export_ipa
        env:
          SIGNING_ENABLED: ${{ steps.dev_signing.outputs.signing_enabled }}
          IOS_DEV_TEAM_ID: ${{ secrets.IOS_DEV_TEAM_ID }}
          PROFILE_NAME: ${{ steps.dev_signing.outputs.profile_name }}
        run: |
          cd ios
          if [ "$SIGNING_ENABLED" = "true" ]; then
            EXPORT_METHOD="development"
            TEAM_ID="$IOS_DEV_TEAM_ID"
          else
            echo "IPA export requires iOS development signing secrets."
            echo "Configure IOS_DEV_CERTIFICATE_BASE64, IOS_DEV_CERTIFICATE_PASSWORD,"
            echo "IOS_DEV_PROVISIONING_PROFILE_BASE64, and IOS_DEV_TEAM_ID."
            echo "See docs/GITHUB_ACTIONS_SETUP.md"
            exit 1
          fi

          if [ -z "$TEAM_ID" ]; then
            echo "Missing IOS_DEV_TEAM_ID secret (required when development signing is enabled)"
            exit 1
          fi

          if [ -z "$PROFILE_NAME" ]; then
            echo "Missing provisioning profile name from signing step"
            exit 1
          fi

          BUNDLE_ID="${{ env.IOS_BUNDLE_ID }}"
          EXPORT_OPTIONS="$PWD/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string $EXPORT_METHOD" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${BUNDLE_ID} string ${PROFILE_NAME}" "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/AlphaVlogs-dev.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          IPA_PATH="$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "IPA not found in $PWD/build/export"
            find "$PWD/build/export" -type f -print
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA exported: $(du -h "$IPA_PATH" | cut -f1) ($IPA_PATH)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa
          path: ${{ steps.export_ipa.outputs.ipa_path }}
          retention-days: 30

      - name: Validate Firebase credentials
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "Missing required secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "$FIREBASE_SA_JSON" > "${{ runner.temp }}/firebase-service-account.json"
          if [ ! -s "${{ runner.temp }}/firebase-service-account.json" ]; then
            echo "Failed to write Firebase service account file"
            exit 1
          fi

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Upload IPA to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_TESTER_EMAILS: ${{ secrets.FIREBASE_TESTER_EMAILS }}
        run: |
          echo "Node version for Firebase CLI: $(node -v)"
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major<20){console.error('firebase-tools 15.x requires Node 20+'); process.exit(1)}"

          FIREBASE_VERSION=15.22.0
          FB="npx --yes firebase-tools@${FIREBASE_VERSION}"

          IPA_PATH="${{ steps.export_ipa.outputs.ipa_path }}"
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${{ github.sha }}"
          RELEASE_NOTES="iOS Dev build #${BUILD_NUMBER}"$'\n'"Bundle ID: ${{ env.IOS_BUNDLE_ID }}"$'\n'"Commit: ${BUILD_SHA:0:7}"$'\n'"Workflow: ${{ github.workflow }}"

          if [ ! -f "$IPA_PATH" ]; then
            echo "IPA not found at $IPA_PATH"
            exit 1
          fi

          IPA_BUNDLE_ID=$(unzip -p "$IPA_PATH" 'Payload/*.app/Info.plist' | plutil -extract CFBundleIdentifier raw -)
          if [ "$IPA_BUNDLE_ID" != "${{ env.IOS_BUNDLE_ID }}" ]; then
            echo "IPA bundle ID mismatch: expected ${{ env.IOS_BUNDLE_ID }}, got $IPA_BUNDLE_ID"
            exit 1
          fi
          echo "IPA bundle ID: $IPA_BUNDLE_ID"

          $FB appdistribution:group:create "Testers" "${{ env.FIREBASE_TESTER_GROUP }}" \
            --project "${{ env.FIREBASE_PROJECT_ID }}" 2>/dev/null || true

          DISTRIBUTE_ARGS=(
            --app "${{ steps.firebase_app.outputs.app_id }}"
            --release-notes "$RELEASE_NOTES"
            --project "${{ env.FIREBASE_PROJECT_ID }}"
          )

          if [ -n "${FIREBASE_TESTER_EMAILS:-}" ]; then
            DISTRIBUTE_ARGS+=(--testers "$FIREBASE_TESTER_EMAILS")
          fi

          if [ -n "${{ env.FIREBASE_TESTER_GROUP }}" ]; then
            DISTRIBUTE_ARGS+=(--groups "${{ env.FIREBASE_TESTER_GROUP }}")
          fi

          if [ ${#DISTRIBUTE_ARGS[@]} -le 3 ]; then
            echo "No testers configured. Set FIREBASE_TESTER_EMAILS secret and/or FIREBASE_TESTER_GROUP."
            exit 1
          fi

          $FB appdistribution:distribute "$IPA_PATH" "${DISTRIBUTE_ARGS[@]}"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## iOS Dev — Build Summary"
            echo "- **Bundle ID:** \`${{ env.IOS_BUNDLE_ID }}\`"
