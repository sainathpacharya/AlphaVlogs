name: Android and iOS Production

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to build and publish'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      version_name:
        description: 'Semantic version (e.g. 1.0.0). Used when not triggered by a version tag.'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: android-ios-production-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PACKAGE_NAME: com.nsnr.alphavlogs
  PLAY_STORE_TRACK: internal
  IOS_BUNDLE_ID: com.nsnr.alphavlogsindia
  # Xcode 26 runners default to the Metal cryptex toolchain, whose Swift lib
  # search path lacks the back-compat archives (libswiftCompatibility56.a, etc.)
  # that prebuilt Firebase binaries force-load, breaking the link. Pin the
  # default Xcode toolchain so those libraries are found.
  # https://github.com/actions/runner-images/issues/13135
  TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault

jobs:
  validate:
    name: Validate (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: yarn lint --max-warnings=0

      - name: Run TypeScript validation
        run: yarn type-check

      - name: Run Jest tests
        run: yarn test:ci

  android:
    name: Android Production
    needs: validate
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'both' ||
      github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required secrets are present"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "Failed to decode release keystore"
            exit 1
          fi
          printf '%s\n' \
            "storeFile=release.keystore" \
            "storePassword=${ANDROID_STORE_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            > android/app/keystore.properties
          echo "Release keystore configured for alias: ${ANDROID_KEY_ALIAS}"

      - name: Calculate Play Store version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "Version from tag: $VERSION_NAME"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            echo "Version from workflow input: $VERSION_NAME"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ] && [[ "$LATEST_TAG" == v* ]]; then
              VERSION_NAME="${LATEST_TAG#v}"
              echo "Version from latest tag: $VERSION_NAME"
            else
              echo "Manual dispatch requires version_name input or an existing git tag (v*.*.*)"
              exit 1
            fi
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          if [ "$VERSION_CODE" -le 0 ]; then
            echo "Invalid version code: $VERSION_CODE"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Build signed production AAB
        run: |
          cd android
          echo "Building signed AAB — package: ${{ env.ANDROID_PACKAGE_NAME }}"
          ./gradlew bundleProductionRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon

          AAB_PATH="app/build/outputs/bundle/productionRelease/app-production-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "AAB built: $(du -h "$AAB_PATH" | cut -f1)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab
          path: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 90

      - name: Deploy to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          tracks: ${{ env.PLAY_STORE_TRACK }}
          status: completed
          changesNotSentForReview: false

      - name: Build summary
        run: |
          {
            echo "## Android Production — Build Summary"
            echo "- **Package:** \`${{ env.ANDROID_PACKAGE_NAME }}\`"
            echo "- **Version name:** \`${{ steps.version.outputs.version_name }}\`"
            echo "- **Version code:** \`${{ steps.version.outputs.version_code }}\`"
            echo "- **Play Store track:** \`${{ env.PLAY_STORE_TRACK }}\` (not production)"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Tag:** \`${{ github.ref_name }}\`"
            echo "- **Artifact:** \`android-production-aab\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS Production
    needs: validate
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'both' ||
      github.event.inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Validate required secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID APPLE_KEY_ID APPLE_ISSUER_ID APPLE_PRIVATE_KEY; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required secrets are present"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Resolve App Store version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "Version from tag: $VERSION_NAME"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            echo "Version from workflow input: $VERSION_NAME"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ] && [[ "$LATEST_TAG" == v* ]]; then
              VERSION_NAME="${LATEST_TAG#v}"
              echo "Version from latest tag: $VERSION_NAME"
            else
              echo "Manual dispatch requires version_name input or an existing git tag (v*.*.*)"
              exit 1
            fi
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version_name '$VERSION_NAME'. Expected format: MAJOR.MINOR.PATCH (e.g. 1.0.0)"
            exit 1
          fi

          # TestFlight requires a unique CFBundleVersion per upload; use run number.
          BUILD_NUMBER="${{ github.run_number }}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $VERSION_NAME"
          echo "Build number: $BUILD_NUMBER"

      - name: Import certificates and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'github-actions' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate is empty. APPLE_CERTIFICATE_BASE64 is missing or not valid base64."
            echo "Re-create it with:  base64 -i Certificates.p12 | pbcopy   (macOS) and paste into the secret."
            exit 1
          fi

          # Preflight: confirm the .p12 can be opened with the provided password before importing.
          # This surfaces a wrong APPLE_CERTIFICATE_PASSWORD with a clear message instead of a cryptic keychain error.
          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -nokeys -legacy >/dev/null 2>&1 \
             && ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -nokeys >/dev/null 2>&1; then
            echo "::error::Cannot open the certificate with APPLE_CERTIFICATE_PASSWORD."
            echo "Either the password is wrong, or the base64 does not contain a valid .p12."
            echo "Verify locally with:  openssl pkcs12 -in Certificates.p12 -nokeys -info"
            exit 1
          fi

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          if [ -z "$PROFILE_UUID" ]; then
            echo "Failed to extract provisioning profile UUID"
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH" "$PROFILE_PLIST"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile imported: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Archive signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          # Archive without signing so the code-signing build settings are not forced onto
          # the CocoaPods library targets (which cannot carry a provisioning profile).
          # The app is signed later during -exportArchive using ExportOptions.plist.
          xcodebuild clean archive \
            -workspace JackMarvelsApp.xcworkspace \
            -scheme JackMarvelsApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/AlphaVlogs-production.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ env.IOS_BUNDLE_ID }}" \
            MARKETING_VERSION="${{ steps.version.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          if [ ! -d "$PWD/build/AlphaVlogs-production.xcarchive" ]; then
            echo "Archive not created"
            exit 1
          fi

      - name: Export App Store IPA
        id: export_ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.IOS_BUNDLE_ID }}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/AlphaVlogs-production.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist

          IPA_PATH="$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "IPA not found in $PWD/build/export"
            find "$PWD/build/export" -type f -print
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA exported: $(du -h "$IPA_PATH" | cut -f1) ($IPA_PATH)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-ipa
          path: ${{ steps.export_ipa.outputs.ipa_path }}
          retention-days: 90

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.export_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_PRIVATE_KEY }}

      - name: Build summary
        run: |
          {
            echo "## iOS Production — Build Summary"
            echo "- **Bundle ID:** \`${{ env.IOS_BUNDLE_ID }}\`"
            echo "- **Version:** \`${{ steps.version.outputs.version_name }}\` (build ${{ steps.version.outputs.build_number }})"
            echo "- **Destination:** TestFlight only (not App Store production release)"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Tag:** \`${{ github.ref_name }}\`"
            echo "- **Artifact:** \`ios-production-ipa\`"
            echo "- **App Store Connect:** [TestFlight](https://appstoreconnect.apple.com)"
          } >> "$GITHUB_STEP_SUMMARY"
