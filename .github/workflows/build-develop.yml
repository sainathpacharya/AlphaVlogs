name: Build Develop (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      build_type:
        description: 'Android build type (apk or aab)'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

env:
  PACKAGE_NAME_DEVELOP: com.nsnr.aplhavlogs.dev
  BUNDLE_ID_DEVELOP: com.nsnr.aplhavlogs.dev

jobs:
  build-android:
    name: Build Android Develop
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event.inputs.platform == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Verify Node.js
        run: |
          echo "Node.js version: $(node --version)"
          echo "Node.js path: $(which node)"
          echo "✅ Node.js is available in PATH"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == ''
        run: |
          cd android
          # For Firebase App Distribution: Use GitHub Actions run number as version code
          # Firebase allows multiple builds with the same app version as long as build number is unique
          # This is different from Play Store which requires strict version increments
          VERSION_CODE=${{ github.run_number }}
          echo "📦 Building APK for Firebase App Distribution"
          echo "   Version Code: $VERSION_CODE (from GitHub run number)"
          echo "   Build number: ${{ github.run_number }}"
          echo "   Commit SHA: ${{ github.sha }}"
          echo "   Note: Firebase allows same version name with unique build numbers"

          ./gradlew assembleDevelopRelease \
            -PversionCode=$VERSION_CODE \
            --no-daemon
            
          # Verify the version code was applied
          echo ""
          echo "🔍 Verifying APK version code..."
          APK_PATH="app/build/outputs/apk/develop/release/app-develop-release.apk"
          METADATA_PATH="app/build/outputs/apk/develop/release/output-metadata.json"

          if [ -f "$METADATA_PATH" ]; then
            echo "📄 Checking build metadata..."
            METADATA_VERSION_CODE=$(grep -o '"versionCode":[^,]*' "$METADATA_PATH" | grep -o '[0-9]\+' | head -n 1)
            METADATA_VERSION_NAME=$(grep -o '"versionName":"[^"]*"' "$METADATA_PATH" | grep -o '"[^"]*"' | head -n 1)
            echo "   Version Code: ${METADATA_VERSION_CODE:-'not found'} (expected: $VERSION_CODE)"
            echo "   Version Name: ${METADATA_VERSION_NAME:-'not found'}"
            if [ -n "$METADATA_VERSION_CODE" ] && [ "$METADATA_VERSION_CODE" != "$VERSION_CODE" ]; then
              echo "⚠️ Warning: Version code mismatch! Expected $VERSION_CODE but got $METADATA_VERSION_CODE"
            elif [ -n "$METADATA_VERSION_CODE" ]; then
              echo "✅ Version code verified: $METADATA_VERSION_CODE"
            fi
          else
            echo "⚠️ Metadata file not found at $METADATA_PATH"
          fi

          if [ -f "$APK_PATH" ]; then
            echo "✅ APK built successfully: $APK_PATH"
            echo "   Size: $(du -h "$APK_PATH" | cut -f1)"
          else
            echo "❌ APK not found at $APK_PATH"
          fi

      - name: Build AAB
        if: github.event.inputs.build_type == 'aab'
        run: |
          cd android
          # For Firebase App Distribution: Use GitHub Actions run number as version code
          # Firebase allows multiple builds with the same app version as long as build number is unique
          VERSION_CODE=${{ github.run_number }}
          echo "📦 Building AAB for Firebase App Distribution"
          echo "   Version Code: $VERSION_CODE (from GitHub run number)"
          ./gradlew bundleDevelopRelease \
            -PversionCode=$VERSION_CODE \
            --no-daemon

      - name: Upload APK artifact
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-develop
          path: android/app/build/outputs/apk/develop/release/app-develop-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: github.event.inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-develop
          path: android/app/build/outputs/bundle/develop/release/app-develop-release.aab
          retention-days: 30

      - name: Setup Firebase Service Account
        id: setup_firebase
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          SERVICE_ACCOUNT_FILE="${{ runner.temp }}/firebase-service-account.json"

          # Write secret to file and check if it was written successfully
          if [ -n "$FIREBASE_SA_JSON" ]; then
            echo "$FIREBASE_SA_JSON" > "$SERVICE_ACCOUNT_FILE"
            # Verify the file was created and has content
            if [ -f "$SERVICE_ACCOUNT_FILE" ] && [ -s "$SERVICE_ACCOUNT_FILE" ]; then
              echo "✅ Firebase service account configured"
              echo "firebase_configured=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Failed to write service account file"
              echo "firebase_configured=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_JSON secret not found. Skipping Firebase App Distribution upload."
            echo "firebase_configured=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload APK to Firebase App Distribution
        if: (github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == '') && steps.setup_firebase.outputs.firebase_configured == 'true'
        run: |
          # Verify APK exists
          APK_PATH="android/app/build/outputs/apk/develop/release/app-develop-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH. Build may have failed."
            exit 1
          fi

          echo "✅ APK found: $APK_PATH"
          echo "📦 APK size: $(du -h "$APK_PATH" | cut -f1)"

          # Install Firebase CLI if not available
          if ! command -v firebase &> /dev/null; then
            echo "📦 Installing Firebase CLI..."
            npm install -g firebase-tools
          fi

          # Authenticate with service account
          SERVICE_ACCOUNT_FILE="${{ runner.temp }}/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$SERVICE_ACCOUNT_FILE"

          if [ ! -f "$SERVICE_ACCOUNT_FILE" ]; then
            echo "❌ Service account file not found at $SERVICE_ACCOUNT_FILE"
            exit 1
          fi

          echo "📤 Uploading APK to Firebase App Distribution using Firebase CLI..."
          echo "Package: com.nsnr.aplhavlogs.dev"

          # Get the develop app ID from secret, or use the default from google-services.json
          # Note: Both production and develop builds upload to the SAME Firebase project
          # and use the SAME tester groups. They just need separate Firebase apps because
          # Firebase requires package names to match.
          DEVELOP_APP_ID="${{ secrets.FIREBASE_DEVELOP_APP_ID }}"

          # Default to the app ID from google-services.json if secret is not set
          if [ -z "$DEVELOP_APP_ID" ]; then
            DEVELOP_APP_ID="1:452248149004:android:2062c0a9b5826798af2229"
            echo "ℹ️ Using default develop app ID from google-services.json"
          fi

          # Use Firebase CLI to upload to the same project and tester groups
          echo "📤 Uploading to Firebase App Distribution..."
          echo "   Project: alpha-vlogs-cf60a"
          echo "   Tester Group: testers (same as production)"
          echo "   App ID: $DEVELOP_APP_ID"

          # Upload APK to Firebase App Distribution
          # Note: If tester group doesn't exist, upload will succeed but distribution will fail
          # This is okay - the build will be available in Firebase Console for manual distribution
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${{ github.sha }}"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          RELEASE_NOTES="Development build #${BUILD_NUMBER} - Alpha Vlogs Dev"$'\n'$'\n'"Build Date: ${BUILD_DATE}"$'\n'"Commit: ${BUILD_SHA:0:7}"$'\n'"Workflow: ${{ github.workflow }}"$'\n'"Run: #${BUILD_NUMBER}"

          echo "📤 Uploading build #${BUILD_NUMBER} to Firebase App Distribution..."
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$DEVELOP_APP_ID" \
            --groups "testers" \
            --release-notes "$RELEASE_NOTES" \
            --project "alpha-vlogs-cf60a" || {
              echo ""
              echo "⚠️ Upload succeeded but distribution to 'testers' group failed."
              echo "   This usually means the 'testers' group doesn't exist for this app yet."
              echo ""
              echo "📝 To fix this:"
              echo "   1. Go to: https://console.firebase.google.com/project/alpha-vlogs-cf60a/appdistribution"
              echo "   2. Select the app: com.nsnr.aplhavlogs.dev"
              echo "   3. Go to 'Testers & Groups' tab"
              echo "   4. Create a group named 'testers' or add testers directly"
              echo "   5. The build is already uploaded and available in the Releases tab"
              echo ""
              echo "✅ Build uploaded successfully - available for manual distribution"
              exit 0
            }

          echo "✅ Successfully uploaded and distributed to Firebase App Distribution"
        continue-on-error: true

      - name: Upload AAB to Firebase App Distribution
        if: github.event.inputs.build_type == 'aab' && steps.setup_firebase.outputs.firebase_configured == 'true'
        run: |
          # Verify AAB exists
          AAB_PATH="android/app/build/outputs/bundle/develop/release/app-develop-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB not found at $AAB_PATH. Build may have failed."
            exit 1
          fi

          echo "✅ AAB found: $AAB_PATH"
          echo "📦 AAB size: $(du -h "$AAB_PATH" | cut -f1)"

          # Install Firebase CLI if not available
          if ! command -v firebase &> /dev/null; then
            echo "📦 Installing Firebase CLI..."
            npm install -g firebase-tools
          fi

          # Authenticate with service account
          SERVICE_ACCOUNT_FILE="${{ runner.temp }}/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$SERVICE_ACCOUNT_FILE"

          if [ ! -f "$SERVICE_ACCOUNT_FILE" ]; then
            echo "❌ Service account file not found at $SERVICE_ACCOUNT_FILE"
            exit 1
          fi

          echo "📤 Uploading AAB to Firebase App Distribution using Firebase CLI..."
          echo "Package: com.nsnr.aplhavlogs.dev"

          # Get the develop app ID from secret, or use the default from google-services.json
          DEVELOP_APP_ID="${{ secrets.FIREBASE_DEVELOP_APP_ID }}"

          # Default to the app ID from google-services.json if secret is not set
          if [ -z "$DEVELOP_APP_ID" ]; then
            DEVELOP_APP_ID="1:452248149004:android:2062c0a9b5826798af2229"
            echo "ℹ️ Using default develop app ID from google-services.json"
          fi

          # Use Firebase CLI to upload to the same project and tester groups
          echo "📤 Uploading to Firebase App Distribution..."
          echo "   Project: alpha-vlogs-cf60a"
          echo "   Tester Group: testers (same as production)"
          echo "   App ID: $DEVELOP_APP_ID"

          # Upload AAB to Firebase App Distribution
          # Note: If tester group doesn't exist, upload will succeed but distribution will fail
          # This is okay - the build will be available in Firebase Console for manual distribution
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${{ github.sha }}"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          RELEASE_NOTES="Development build #${BUILD_NUMBER} - Alpha Vlogs Dev"$'\n'$'\n'"Build Date: ${BUILD_DATE}"$'\n'"Commit: ${BUILD_SHA:0:7}"$'\n'"Workflow: ${{ github.workflow }}"$'\n'"Run: #${BUILD_NUMBER}"

          echo "📤 Uploading build #${BUILD_NUMBER} to Firebase App Distribution..."
          firebase appdistribution:distribute "$AAB_PATH" \
            --app "$DEVELOP_APP_ID" \
            --groups "testers" \
            --release-notes "$RELEASE_NOTES" \
            --project "alpha-vlogs-cf60a" || {
              echo ""
              echo "⚠️ Upload succeeded but distribution to 'testers' group failed."
              echo "   This usually means the 'testers' group doesn't exist for this app yet."
              echo ""
              echo "📝 To fix this:"
              echo "   1. Go to: https://console.firebase.google.com/project/alpha-vlogs-cf60a/appdistribution"
              echo "   2. Select the app: com.nsnr.aplhavlogs.dev"
              echo "   3. Go to 'Testers & Groups' tab"
              echo "   4. Create a group named 'testers' or add testers directly"
              echo "   5. The build is already uploaded and available in the Releases tab"
              echo ""
              echo "✅ Build uploaded successfully - available for manual distribution"
              exit 0
            }

          echo "✅ Successfully uploaded and distributed to Firebase App Distribution"

          echo "✅ Successfully uploaded to Firebase App Distribution"
        continue-on-error: true

  build-ios:
    name: Build iOS Develop
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event.inputs.platform == ''
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Check Xcode version
        run: |
          echo "🔍 Verifying Xcode version..."
          xcodebuild -version
          xcode-select -p
          echo "✅ Xcode version verified"

      - name: Clean and install Pods
        run: |
          cd ios
          echo "🧹 Cleaning Pods..."
          rm -rf Pods Podfile.lock
          echo "📦 Installing CocoaPods dependencies..."
          pod install --repo-update
          echo "✅ Pods installed successfully"

      - name: Build iOS Archive
        id: build_ios
        continue-on-error: true
        run: |
          cd ios

          echo "🔨 Building iOS archive for develop..."
          echo "Bundle ID: ${{ env.BUNDLE_ID_DEVELOP }}"
          echo "Starting build at: $(date)"

          # Run build and capture all output
          xcodebuild clean archive \
            -workspace JackMarvelsApp.xcworkspace \
            -scheme JackMarvelsApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/JackMarvelsApp-develop.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=${{ env.BUNDLE_ID_DEVELOP }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Archive built successfully!"
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -n 100 build.log
            echo ""
            echo "=== Searching for error patterns ==="
            grep -i "error:" build.log | tail -n 20 || echo "No explicit errors found in log"
            echo ""
            echo "=== Checking for archive ==="
            if [ -d "$PWD/build/JackMarvelsApp-develop.xcarchive" ]; then
              echo "⚠️ Archive exists despite build failure - may be partial"
            else
              echo "❌ Archive not created"
            fi
            echo "build_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-develop
          path: ios/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Check Build Status
        if: steps.build_ios.outputs.build_success != 'true'
        run: |
          echo ""
          echo "❌ iOS build failed. Showing error summary..."
          echo ""

          # Try to show error details from the build log if it exists
          BUILD_LOG_PATH="ios/build.log"
          if [ -f "$BUILD_LOG_PATH" ]; then
            echo "=== Build Error Summary ==="
            echo ""
            
            # Show last 100 lines (more context)
            echo "Last 100 lines of build log:"
            echo "----------------------------------------"
            tail -n 100 "$BUILD_LOG_PATH"
            echo "----------------------------------------"
            echo ""
            
            # Search for common error patterns
            echo "=== Critical Errors ==="
            grep -iE "(error|failed|fatal)" "$BUILD_LOG_PATH" | tail -n 30 || echo "No critical errors found"
            echo ""
            
            echo "=== Build Failures ==="
            grep -i "ARCHIVE FAILED\|BUILD FAILED\|CompileC.*failed" "$BUILD_LOG_PATH" | tail -n 10 || echo "No build failure messages found"
            echo ""
            
            echo "📄 Full build log available in artifact: ios-build-log-develop"
          else
            echo "⚠️ Build log file not found at $BUILD_LOG_PATH"
            echo "   The build may have failed before logging started."
            echo "   Check the 'Build iOS Archive' step output above for details."
          fi

          echo ""
          echo "💡 Common iOS build issues:"
          echo "   1. Missing dependencies - check if 'pod install' completed successfully"
          echo "   2. Code signing issues - ensure CODE_SIGNING_REQUIRED=NO is set"
          echo "   3. Xcode version compatibility - check if all dependencies support the Xcode version"
          echo "   4. Memory/timeout - build may have been killed due to resource limits"
          echo "   5. Firebase SDK not installed - check AppDelegate.mm for conditional Firebase import"
          echo ""
          echo "📥 Download the 'ios-build-log-develop' artifact for the complete build log"
          exit 1

      - name: Export IPA from Archive
        id: export_ipa
        if: steps.build_ios.outputs.build_success == 'true'
        run: |
          cd ios
          # Check if archive exists
          if [ ! -d "$PWD/build/JackMarvelsApp-develop.xcarchive" ]; then
            echo "❌ Archive not found. Build may have failed."
            echo "ipa_exported=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Archive found. Attempting to export IPA..."

          # Create minimal ExportOptions.plist for ad-hoc distribution (no code signing required)
          cat > "$PWD/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string></string>
          </dict>
          </plist>
          EOF

          # Try to export IPA
          echo "📦 Exporting IPA from archive..."
          xcodebuild -exportArchive \
            -archivePath $PWD/build/JackMarvelsApp-develop.xcarchive \
            -exportPath $PWD/build/export \
            -exportOptionsPlist $PWD/ExportOptions.plist \
            -allowProvisioningUpdates 2>&1 | tee export.log || {
              echo ""
              echo "⚠️ IPA export failed. Checking export log..."
              tail -n 50 export.log || true
              echo ""
              echo "📝 Note: IPA export requires code signing configuration."
              echo "   Archive is available for manual export at: $PWD/build/JackMarvelsApp-develop.xcarchive"
              echo "ipa_exported=false" >> $GITHUB_OUTPUT
              exit 0
            }

          # Verify IPA was created
          IPA_PATH="$PWD/build/export/JackMarvelsApp.ipa"
          if [ -f "$IPA_PATH" ]; then
            echo "✅ IPA exported successfully!"
            echo "   Path: $IPA_PATH"
            echo "   Size: $(du -h "$IPA_PATH" | cut -f1)"
            echo "ipa_exported=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ IPA export completed but file not found at expected path: $IPA_PATH"
            echo "   Checking export directory..."
            ls -la "$PWD/build/export/" || echo "   Export directory not found"
            echo "ipa_exported=false" >> $GITHUB_OUTPUT
          fi

      - name: IPA Export Status
        if: steps.build_ios.outputs.build_success == 'true'
        run: |
          if [ "${{ steps.export_ipa.outputs.ipa_exported }}" != "true" ]; then
            echo "⚠️ IPA was not exported successfully."
            echo ""
            echo "📝 To upload to Firebase App Distribution, you need to:"
            echo "   1. Download the archive artifact: ios-archive-develop"
            echo "   2. Open the archive in Xcode"
            echo "   3. Export as IPA (Ad Hoc or Development)"
            echo "   4. Upload manually to Firebase App Distribution"
            echo ""
            echo "   Or configure code signing in CI/CD to enable automatic IPA export."
            echo ""
            echo "   Archive location: ios/build/JackMarvelsApp-develop.xcarchive"
          else
            echo "✅ IPA exported successfully and ready for Firebase upload"
          fi

      - name: Setup Firebase Service Account
        id: setup_firebase_ios
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          SERVICE_ACCOUNT_FILE="${{ runner.temp }}/firebase-service-account.json"
          if [ -n "$FIREBASE_SA_JSON" ]; then
            echo "$FIREBASE_SA_JSON" > "$SERVICE_ACCOUNT_FILE"
            if [ -f "$SERVICE_ACCOUNT_FILE" ]; then
              echo "✅ Firebase service account configured"
              echo "firebase_configured=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to write Firebase service account file."
              echo "firebase_configured=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_JSON secret not found. Skipping Firebase App Distribution upload."
            echo "firebase_configured=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload IPA to Firebase App Distribution
        if: steps.setup_firebase_ios.outputs.firebase_configured == 'true' && steps.export_ipa.outputs.ipa_exported == 'true'
        run: |
          # Install Firebase CLI if not available
          if ! command -v firebase &> /dev/null; then
            echo "📦 Installing Firebase CLI..."
            npm install -g firebase-tools
          fi

          # Authenticate with service account
          SERVICE_ACCOUNT_FILE="${{ runner.temp }}/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$SERVICE_ACCOUNT_FILE"

          # iOS App ID for develop
          # Get from secret, or use default from GoogleService-Info.plist for develop
          IOS_DEVELOP_APP_ID="${{ secrets.FIREBASE_IOS_DEVELOP_APP_ID }}"

          # Default to the develop app ID if secret is not set
          if [ -z "$IOS_DEVELOP_APP_ID" ]; then
            IOS_DEVELOP_APP_ID="1:452248149004:ios:406e170c19e53736af2229"
            echo "ℹ️ Using default iOS develop app ID from GoogleService-Info.plist"
          fi

          IOS_APP_ID="$IOS_DEVELOP_APP_ID"

          # Find IPA file
          IPA_PATH="ios/build/export/JackMarvelsApp.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ IPA not found at $IPA_PATH."
            echo "   Expected path: $IPA_PATH"
            echo "   Checking alternative locations..."
            find ios/build -name "*.ipa" -type f || echo "   No IPA files found"
            exit 1
          fi

          echo "✅ IPA found: $IPA_PATH"
          echo "📦 IPA size: $(du -h "$IPA_PATH" | cut -f1)"
          echo "📤 Uploading to Firebase App Distribution..."
          echo "   Project: alpha-vlogs-cf60a"
          echo "   Tester Group: testers"
          echo "   App ID: $IOS_APP_ID"

          firebase appdistribution:distribute "$IPA_PATH" \
            --app "$IOS_APP_ID" \
            --groups "testers" \
            --release-notes "iOS Development build - Alpha Vlogs Dev - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            --project "alpha-vlogs-cf60a" || {
              echo ""
              echo "⚠️ Upload succeeded but distribution to 'testers' group failed."
              echo "   This usually means the 'testers' group doesn't exist for this app yet."
              echo ""
              echo "📝 To fix this:"
              echo "   1. Go to: https://console.firebase.google.com/project/alpha-vlogs-cf60a/appdistribution"
              echo "   2. Select the iOS app: com.nsnr.aplhavlogs.dev"
              echo "   3. Go to 'Testers & Groups' tab"
              echo "   4. Create a group named 'testers' or add testers directly"
              echo "   5. The build is already uploaded and available in the Releases tab"
              echo ""
              echo "✅ Build uploaded successfully - available for manual distribution"
              exit 0
            }

          echo "✅ Successfully uploaded and distributed to Firebase App Distribution"
        continue-on-error: true

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-develop
          path: ios/build/JackMarvelsApp-develop.xcarchive
          retention-days: 30

  build-summary:
    name: Build Summary
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## Develop Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** develop" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Android: \`android-apk-develop\` or \`android-aab-develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: \`ios-archive-develop\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "### ✅ Firebase App Distribution" >> $GITHUB_STEP_SUMMARY
            echo "Build has been automatically uploaded to Firebase App Distribution." >> $GITHUB_STEP_SUMMARY
            echo "Testers in the \`testers\` group will be notified." >> $GITHUB_STEP_SUMMARY
            echo "- View in [Firebase Console](https://console.firebase.google.com/project/alpha-vlogs-cf60a/appdistribution)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Firebase App Distribution" >> $GITHUB_STEP_SUMMARY
            echo "To enable automatic uploads, configure the \`FIREBASE_SERVICE_ACCOUNT_JSON\` secret." >> $GITHUB_STEP_SUMMARY
            echo "See \`FIREBASE_APP_DISTRIBUTION.md\` for setup instructions." >> $GITHUB_STEP_SUMMARY
          fi
