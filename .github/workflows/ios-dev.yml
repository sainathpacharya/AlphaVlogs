name: iOS Dev — Build & Firebase Distribution

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ios-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.nsnr.aplhavlogs.dev
  FIREBASE_PROJECT_ID: alpha-vlogs-cf60a
  FIREBASE_TESTER_GROUP: testers
  FIREBASE_PLIST_PATH: ios/JackMarvelsApp/GoogleService-Info-Develop.plist

jobs:
  build-and-distribute:
    name: iOS Develop
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-development

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: yarn lint --max-warnings=0

      - name: Run TypeScript validation
        run: yarn type-check

      - name: Run Jest tests
        run: yarn test:ci

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Resolve Firebase iOS App ID
        id: firebase_app
        run: |
          if [ ! -f "${{ env.FIREBASE_PLIST_PATH }}" ]; then
            echo "Missing Firebase plist: ${{ env.FIREBASE_PLIST_PATH }}"
            exit 1
          fi
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "${{ env.FIREBASE_PLIST_PATH }}")
          BUNDLE_IN_PLIST=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "${{ env.FIREBASE_PLIST_PATH }}")
          if [ "$BUNDLE_IN_PLIST" != "${{ env.BUNDLE_ID }}" ]; then
            echo "Firebase plist BUNDLE_ID mismatch: expected ${{ env.BUNDLE_ID }}, got $BUNDLE_IN_PLIST"
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Firebase App ID: $APP_ID"

      - name: Setup development code signing (optional)
        id: dev_signing
        env:
          IOS_DEV_CERTIFICATE_BASE64: ${{ secrets.IOS_DEV_CERTIFICATE_BASE64 }}
          IOS_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEV_CERTIFICATE_PASSWORD }}
          IOS_DEV_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'github-actions' }}
        run: |
          if [ -z "$IOS_DEV_CERTIFICATE_BASE64" ] || [ -z "$IOS_DEV_PROVISIONING_PROFILE_BASE64" ]; then
            echo "No iOS development signing secrets configured — building unsigned archive"
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$IOS_DEV_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_DEV_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "$IOS_DEV_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(grep -aA1 UUID profile.mobileprovision | grep -o "[-A-Z0-9]\{36\}")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          rm certificate.p12 profile.mobileprovision
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
          echo "Development signing configured"

      - name: Build iOS archive
        env:
          SIGNING_ENABLED: ${{ steps.dev_signing.outputs.signing_enabled }}
          PROFILE_UUID: ${{ steps.dev_signing.outputs.profile_uuid }}
        run: |
          cd ios
          if [ "$SIGNING_ENABLED" = "true" ]; then
            xcodebuild clean archive \
              -workspace JackMarvelsApp.xcworkspace \
              -scheme JackMarvelsApp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/AlphaVlogs-dev.xcarchive" \
              PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Development" \
              PROVISIONING_PROFILE="$PROFILE_UUID" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES
          else
            xcodebuild clean archive \
              -workspace JackMarvelsApp.xcworkspace \
              -scheme JackMarvelsApp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/AlphaVlogs-dev.xcarchive" \
              PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

          if [ ! -d "$PWD/build/AlphaVlogs-dev.xcarchive" ]; then
            echo "Archive not created"
            exit 1
          fi

      - name: Export development IPA
        id: export_ipa
        env:
          SIGNING_ENABLED: ${{ steps.dev_signing.outputs.signing_enabled }}
          IOS_DEV_TEAM_ID: ${{ secrets.IOS_DEV_TEAM_ID }}
        run: |
          cd ios
          if [ "$SIGNING_ENABLED" = "true" ]; then
            EXPORT_METHOD="development"
            TEAM_ID="$IOS_DEV_TEAM_ID"
          else
            echo "IPA export requires iOS development signing secrets."
            echo "Configure IOS_DEV_CERTIFICATE_BASE64, IOS_DEV_CERTIFICATE_PASSWORD,"
            echo "IOS_DEV_PROVISIONING_PROFILE_BASE64, and IOS_DEV_TEAM_ID."
            echo "See docs/GITHUB_ACTIONS_SETUP.md"
            exit 1
          fi

          if [ -z "$TEAM_ID" ]; then
            echo "Missing IOS_DEV_TEAM_ID secret (required when development signing is enabled)"
            exit 1
          fi

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/AlphaVlogs-dev.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist

          IPA_PATH="$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "IPA not found in $PWD/build/export"
            find "$PWD/build/export" -type f -print
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA exported: $(du -h "$IPA_PATH" | cut -f1) ($IPA_PATH)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa
          path: ${{ steps.export_ipa.outputs.ipa_path }}
          retention-days: 30

      - name: Validate Firebase credentials
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "Missing required secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "$FIREBASE_SA_JSON" > "${{ runner.temp }}/firebase-service-account.json"
          if [ ! -s "${{ runner.temp }}/firebase-service-account.json" ]; then
            echo "Failed to write Firebase service account file"
            exit 1
          fi

      - name: Upload IPA to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npm install -g firebase-tools

          IPA_PATH="${{ steps.export_ipa.outputs.ipa_path }}"
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${{ github.sha }}"
          RELEASE_NOTES="iOS Dev build #${BUILD_NUMBER}"$'\n'"Bundle ID: ${{ env.BUNDLE_ID }}"$'\n'"Commit: ${BUILD_SHA:0:7}"$'\n'"Workflow: ${{ github.workflow }}"

          firebase appdistribution:distribute "$IPA_PATH" \
            --app "${{ steps.firebase_app.outputs.app_id }}" \
            --groups "${{ env.FIREBASE_TESTER_GROUP }}" \
            --release-notes "$RELEASE_NOTES" \
            --project "${{ env.FIREBASE_PROJECT_ID }}"

      - name: Build summary
        run: |
          {
            echo "## iOS Dev — Build Summary"
            echo "- **Bundle ID:** \`${{ env.BUNDLE_ID }}\`"
            echo "- **Firebase App ID:** \`${{ steps.firebase_app.outputs.app_id }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Artifact:** \`ios-dev-ipa\`"
            echo "- **Firebase:** [App Distribution](https://console.firebase.google.com/project/${{ env.FIREBASE_PROJECT_ID }}/appdistribution)"
          } >> "$GITHUB_STEP_SUMMARY"
