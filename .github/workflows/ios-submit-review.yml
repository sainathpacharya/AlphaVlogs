name: Submit iOS for Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional App Store version to submit (e.g. 1.0.4). Defaults to highest TestFlight marketing version.'
        required: false
        type: string
      build:
        description: 'Optional build number (e.g. 51). Defaults to highest build for that version.'
        required: false
        type: string

jobs:
  submit:
    name: Submit iOS for App Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Submit latest TestFlight build
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          IOS_BUNDLE_ID: com.nsnr.alphavlogsindia
          TARGET_VERSION: ${{ github.event.inputs.version || '' }}
          TARGET_BUILD: ${{ github.event.inputs.build || '' }}
        run: node .github/scripts/submit-ios-review.js
