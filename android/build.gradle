buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        // Set React Native node modules directory to avoid node lookup issues
        // This prevents react-native-svg from trying to use node to find react-native
        REACT_NATIVE_NODE_MODULES_DIR = file("../node_modules/react-native")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.7")
        classpath("com.google.firebase:firebase-appdistribution-gradle:5.0.0")
    }
}

// Override RN Firebase default BoM (34.15.0) — newer measurement libs require Kotlin 2.2
project.ext {
    set('react-native', [
        versions: [
            firebase: [
                bom: '33.5.1',
            ],
        ],
    ])
}

apply plugin: "com.facebook.react.rootproject"
